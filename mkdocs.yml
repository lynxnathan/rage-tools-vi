site_name: Rage Tools VI
site_description: RPF9 / GTA VI archive and object-graph reverse engineering
site_author: Rage Tools VI
docs_dir: docs
site_dir: site
use_directory_urls: true

repo_name: rage-tools-vi
repo_url: ""

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true

extra_css:
  - assets/css/extra.css
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/js/mermaid-init.js

nav:
  - Home: index.md
  - Living project: living.md
  - Architecture:
      - System overview: architecture/overview.md
      - Rust CLI: architecture/cli.md
      - Object graph: architecture/object-graph.md
  - RPF9:
      - Container format: rpf9/format.md
      - Metadata regions: rpf9/metadata.md
      - Extraction pipeline: rpf9/pipeline.md
  - Extraction:
      - Inventory and entry point: extraction/inventory.md
      - Containment view: extraction/containment.md
      - Downloads corpus: extraction/downloads-corpus.md
      - Large archives: extraction/large-archives.md
      - Full pipeline: extraction/pipeline.md
      - Audio (AWC/XMA2): extraction/audio.md
      - Packs signatures: extraction/packs-signatures.md
      - BVH4 entries: extraction/bvh4-entries.md
      - Quadtree view: extraction/quadtree.md
  - Data:
      - data.rpf: data/data-rpf.md
      - Textures: data/textures.md
      - Localization: data/localization.md
  - Workstreams:
      - Collaboration: workstreams/collaboration.md
      - Bus protocol: workstreams/bus.md
      - Roadmap: roadmap.md
  - Reference:
      - Report formats: reference/report-formats.md
      - Glossary: reference/glossary.md
  - Source documents:
      - Plan: reference/source-plan.md
      - Investigation: reference/source-investigation.md
      - Format contract: reference/source-format.md
      - AGENTS: reference/source-agents.md
      - Script journal: reference/source-script-journal.md
      - Script status: reference/source-script-status.md

strict: false
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    unrecognized_links: ignore
